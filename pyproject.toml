[project]
name = "guess-ai-game"
version = "0.1.0"
description = "你画我猜 AI — 网页游戏"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn >=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.13"
disallow_untyped_decorators = false
disallow_subclassing_any = false
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*", "pydantic_settings", "sqlite3", "aiosqlite"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
